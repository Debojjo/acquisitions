name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm test -- --coverage | tee test-output.txt
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
          retention-days: 30
          if-no-files-found: warn

      - name: Add test summary
        if: always()
        run: |
          STATUS="${{ steps.tests.outcome }}"
          echo "## Test run: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/lcov.info ]; then
            echo "- Coverage report generated and uploaded as artifact 'coverage-report'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No coverage report found at 'coverage/'. Ensure tests generate coverage." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$STATUS" = "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Failures" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Show test output</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,400p' test-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate on failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error title=Tests failed::One or more tests failed. Run 'npm test' locally to reproduce. See summary for details."
          exit 1
