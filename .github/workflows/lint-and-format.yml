name: Lint and Format

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: npm run format:check
        continue-on-error: true

      - name: Report and fail if issues found
        if: steps.eslint.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: |
          echo "## Lint/Format issues detected" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
            echo "::error title=ESLint issues found::Run 'npm run lint:fix' locally to auto-fix where possible, then commit and push."
          fi
          if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
            echo "::error title=Prettier formatting issues found::Run 'npm run format' locally to format files, then commit and push."
          fi
          exit 1
